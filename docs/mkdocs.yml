          - NCAF pd-neut-tof: tutorials/refine-ncaf-wish.ipynb
          - Si Bragg+PDF: tutorials/joint-si-bragg-pdf.ipynb
          - Co2SiO4 T-scan: tutorials/refine-cosio-d20-tscan.ipynb
      - Simulated Data:
          - LBCO+Si McStas: tutorials/refine-lbco-si-mcstas.ipynb
          - BEER McStas: tutorials/calibrate-beer-ess.ipynb
      - Bayesian Analysis:
          - LBCO pd bumps-dream: tutorials/bayesian-dream-lbco-hrpt.ipynb
          - LBCO pd bumps-dream Resume: tutorials/bayesian-dream-resume-lbco-hrpt.ipynb
          - LBCO pd emcee: tutorials/bayesian-emcee-lbco-hrpt.ipynb
          - LBCO pd emcee Resume: tutorials/bayesian-emcee-resume-lbco-hrpt.ipynb
          - Tb2TiO7 sg bumps-dream: tutorials/bayesian-emcee-tbti-heidi.ipynb
      - Workshops & Schools:
          - DMSC Summer School: tutorials/fitting-exercise-si-lbco.ipynb
  - Verification:
      - Verification: verification/index.md
      - Powder, neutron, constant wavelength:

# Codecov configuration
# https://docs.codecov.com/docs/codecov-yaml

github_checks:
  annotations: true

ignore:
  - 'src/easydiffraction/report/templates/html/vendor/**'
  - 'src/easydiffraction/report/templates/tex/styles/**'
  - 'src/easydiffraction/utils/_vendored/jupyter_dark_detect/**'

comment:
  layout: 'reach, diff, flags, files'
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 1%
        # Project coverage is the real gate (see ADR
        # test-suite-and-validation).
        informational: false
    patch:
      default:
        target: auto
        threshold: 1%
        # Non-blocking: patch grades diff lines against unit-only
        # coverage, so engine/integration-tested code would otherwise
        # always fail. See ADR test-suite-and-validation.
        informational: true
